# Projects (with details for accordion on CV page)
projects:
  - title: "Digital Signal Correction for Communication Stations"
    description: "Engineering-research project on correction of digital signals received by communication stations"
    period: "2024 - Present"
    details: |
      ## Project Overview
      
      Special types of interference arriving at the antenna complicate the reception and decoding of useful subscriber signals. The goal of the project is to develop a machine learning model that effectively predicts interference and has a small number of parameters for online deployment at the base station.
      
      ## Responsibilities
      
      Research of classical physical and machine learning-based models for interference prediction, efficient implementation of mathematical algorithms in high-level languages, and investigation of computational complexity of different approaches.
    url: ""
    github: ""
    tags: ["Machine Learning", "Signal Processing", "Communications", "Research"]
  - title: "Software for Training Large Neural Networks on Heterogeneous Computing Systems"
    description: "Engineering-research project on creating new software for training large neural networks on heterogeneous computing systems"
    period: "2022 - Present"
    details: |
      ## Project Overview
      
      Development of new software platform for training large neural networks on heterogeneous computing systems.
      
      ## Responsibilities
      
      Conducting experiments on computational efficiency of the new approach, writing mathematical code in languages of different levels, and creating machine learning models on the new platform.
    url: ""
    github: ""
    tags: ["Deep Learning", "High Performance Computing", "Software Development", "Research"]
  - title: "Performance Research of Sparse Linear System Solver"
    description: "Engineering-research project on investigating the performance of a sparse linear system solver in a commercial optimization package"
    period: "2020 - 2022"
    details: |
      ## Project Overview
      
      Research project focused on investigating the performance of a sparse linear system solver as part of a commercial optimization package.
      
      ## Responsibilities
      
      Development of experimental framework, analysis of mathematical components, and independent implementation of fragments of new algorithms in C++.
    url: ""
    github: ""
    tags: ["Numerical Methods", "C++", "Optimization", "Research"]

