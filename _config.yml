title: ""
description: "Some yapping about personal experience, teaching and stuff."
baseurl: ""
url: "https://glebkarpov.com"
search_enabled: false

# Personal Information
email: "gleborg.mipt@gmail.com"
github: "https://github.com/glkarpov"
linkedin: ""

# About section
about: " "

# Interests (for home page)
interests:
  - "Numerical Linear Algebra"
  - "Fast matrix computations"
  - "Mathematical Statistics"
  - "Tensor methods for Machine Learning"

# CV file (optional)
cv_file: "/documents/cv.pdf"

# Education
education:
  - degree: "Ph.D. in [Field]"
    institution: "[University]"
    period: "20XX - 20XX"
    description: "Thesis: [Title]"
  # Add more education entries as needed

# Experience
experience:
  - position: "[Position]"
    organization: "[Organization]"
    period: "20XX - Present"
    description: "[Description of your role and achievements]"
  # Add more experience entries as needed

# Projects (with details for accordion on CV page)
projects:
  - title: "Project Name"
    description: "Brief description of the project"
    details: |
      ## Detailed Description
      
      This is a more detailed description that will appear when the accordion is expanded.
      You can use **markdown** here!
      
      - Feature 1
      - Feature 2
      - Feature 3
      
      You can add as much detail as you want here.
    url: "https://project-url.com"
    github: "https://github.com/username/project"
    tags: ["Python", "Machine Learning", "Research"]
  # Add more projects as needed

# Resources & Links
resources:
  - title: "Teaching Materials"
    description: "Educational resources and course materials"
    url: "https://teaching.example.com"
  # Add more resources as needed

# Enable or disable heading anchors
heading_anchors: true

# Footer "Edit this page on GitHub" link text
gh_edit_link: true # show or hide edit this page link
gh_edit_branch: "main" # the branch that your docs is served from
# gh_edit_source: docs # the source that your files originate from
gh_edit_view_mode: "edit" # "tree" or "edit" if you want the user to jump into the editor immediately

# Aux links for the upper right navigation
aux_links:
# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: true

plugins:
  - jekyll-seo-tag

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

theme: jekyll-theme-cayman
